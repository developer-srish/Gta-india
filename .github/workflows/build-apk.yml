
name: Build Grand Theft India APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download project
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      # 4. Install Gradle
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # 5. Check project
      - name: Check Android project
        run: |
          echo "Checking project structure..."
          ls -la
          ls -la app
          echo "Checking Gradle configuration..."
          gradle --version

      # 6. Generate Android debug keystore
      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair \
            -noprompt \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 7. Verify keystore
      - name: Verify Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            echo "ERROR: Debug keystore missing"
            exit 1
          fi
          echo "Debug keystore created successfully"

      # 8. Build Android APK
      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon

      # 9. Verify APK
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK generated successfully!"
          ls -lh "$APK"

      # 10. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grand-Theft-India-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 11. Publish GitHub Release
      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-apk
          name: Grand Theft India - Latest APK
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          
